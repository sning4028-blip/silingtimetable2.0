<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8c8dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>思灵课表</title>
<style>
:root{--brand:#89b4f8;--line:#f0f2f7;--text:#2c3e50;--sub:#9aa1b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:13px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#fdfbfb;color:var(--text);overscroll-behavior-y:contain}
button{font-family:inherit}

/* 顶部浪漫渐变 */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px;
  background:linear-gradient(135deg,#ffb7b2,#f8c8dc);color:#fff;
  box-shadow:0 4px 16px rgba(248,200,220,.4)}
header .nav{width:32px;height:32px;border:0;border-radius:10px;background:rgba(255,255,255,.3);
  color:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
header .nav:active{background:rgba(255,255,255,.5)}
header .title{flex:1;text-align:center;min-width:0}
header .title b{display:block;font-size:16px;font-weight:600}
header .title span{display:block;font-size:10px;opacity:.9;margin-top:1px}

/* 表格圆润化 */
.board{margin:8px;background:#fff;border-radius:16px;overflow-x:hidden;
  box-shadow:0 4px 16px rgba(248,200,220,.15)}
.board-inner{width:100%; min-width: 100%;}
.head-row{display:flex;border-bottom:1px solid var(--line)}
.corner{width:32px;flex:0 0 32px}
.day-head{flex:1;padding:6px 0 5px;text-align:center;font-size:11px;font-weight:600;color:#495067;white-space: nowrap;}
.day-head em{display:block;font-style:normal;font-size:9px;font-weight:400;color:var(--sub);margin-top:1px}
.day-head.today{color:#ff8fa3}
.day-head.today em{color:#ff8fa3}
.body-row{display:flex}
.time-col{width:32px;flex:0 0 32px}
.time-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border-top:1px solid var(--line);color:var(--sub);font-size:8px}
.time-cell:first-child{border-top:0}
.time-cell b{font-size:10px;color:#6b7288;font-weight:600}
.day-col{flex:1;position:relative;border-left:1px solid var(--line); min-width: 0;}
/* 马卡龙课程块 */
.course{position:absolute;left:1.5px;right:1.5px;border-radius:10px;padding:4px 3px;color:#2c3e50;
  overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .2s ease}
.course:active{transform:scale(.96)}
.course .n{font-size:9.5px;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.course .s{font-size:8px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 悬浮按钮 */
.fab{position:fixed;right:15px;bottom:calc(15px + env(safe-area-inset-bottom,0px));
  width:50px;height:50px;border:0;border-radius:50%;z-index:30;
  background:linear-gradient(135deg,#ffb7b2,#f8c8dc);color:#fff;font-size:26px;line-height:1;
  box-shadow:0 6px 18px rgba(248,200,220,.6)}
.fab:active{transform:scale(.94)}

/* 底部编辑面板 */
.mask{position:fixed;inset:0;z-index:100;background:rgba(16,20,40,.45);
  display:none;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:#fff;
  border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:up .3s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
@keyframes up{from{transform:translateY(50px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 14px;font-size:16px;text-align:center;color:#495067}
.sheet label{display:block;margin-bottom:10px;font-size:12px;color:#6b7288}
.sheet label input,.sheet label select,.sheet label textarea{
  display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #e3e6ef;border-radius:12px;
  background:#f8f9fc;font-size:14px;color:var(--text);font-family:inherit}
.sheet label textarea{resize:vertical;min-height:130px;font-size:13px;line-height:1.7}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:none;border-color:#ffb7b2;background:#fff}
.row{display:flex;gap:10px}
.row>label{flex:1}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:all .2s}
.sw.on{border-color:#ff8fa3;transform:scale(1.15)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border:0;border-radius:14px;font-size:15px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,#ffb7b2,#f8c8dc);color:#fff;box-shadow:0 4px 10px rgba(248,200,220,.4)}
.btn.ghost{background:#eef0f5;color:#5a6178}
.btn.danger{background:#ffe8e8;color:#e04a4a;flex:0 0 76px}
.btn:active{opacity:.85}
.tip{font-size:11px;color:var(--sub);margin:-4px 0 12px;line-height:1.6}

/* 🌟 浪漫弹窗专属样式 🌟 */
#lovePopup .sheet {
  background: linear-gradient(135deg, #fff0f5, #ffe4e1);
  border-radius: 28px 28px 0 0;
  text-align: center;
  padding: 30px 20px calc(30px + env(safe-area-inset-bottom,0px));
}
#lovePopup img {
  width: 140px;
  height: 140px;
  object-fit: contain;
  margin-bottom: 15px;
  /* 去掉了原有的心跳动画，避免和 GIF 冲突 */
}
#lovePopup h2 {
  font-size: 20px;
  color: #ff6b81;
  margin: 0 0 20px;
  font-weight: 600;
  letter-spacing: 1px;
}
.love-btns { display: flex; gap: 15px; justify-content: center; }
.love-btns button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-yes { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #fff; box-shadow: 0 6px 15px rgba(255, 154, 158, 0.4); }
.btn-no { background: #fff; color: #ff6b81; border: 1px solid #ffb7b2; }
.love-btns button:active { transform: scale(0.95); }
</style>
</head>
<body>

<!-- 🌟 开屏猫猫弹窗 🌟 -->
<div class="mask open" id="lovePopup">
  <div class="sheet">
    <!-- 请确保在 assets 文件夹里上传了名为 cat.gif 和 dog.gif 的图片 -->
    <img src="cat.gif" alt="猫猫" onerror="this.style.display='none'">
    <h2 id="loveText">今天有没有想宁~</h2>
    <div class="love-btns" id="loveBtns">
      <button class="btn-yes" onclick="loveReply('yes')">想啦🥰</button>
      <button class="btn-no" onclick="loveReply('no')">一点点😤</button>
    </div>
  </div>
</div>

<header>
  <button class="nav" id="prev">‹</button>
  <div class="title" id="titleBox">
    <b id="weekLabel">第 1 周</b>
    <span id="dateLabel"></span>
  </div>
  <button class="nav" id="next">›</button>
  <button class="nav" id="gear">⚙</button>
</header>

<div class="board">
  <div class="board-inner">
    <div class="head-row" id="headRow"></div>
    <div class="body-row" id="bodyRow"></div>
  </div>
</div>

<button class="fab" id="add">+</button>

<!-- 课程编辑 -->
<div class="mask" id="editor">
  <div class="sheet">
    <h3 id="modalTitle">添加课程</h3>
    <label>课程名称<input id="f-name" placeholder="例如：高等数学" autocomplete="off"></label>
    <label>星期<select id="f-day"></select></label>
    <div class="row">
      <label>开始节次<select id="f-start"></select></label>
      <label>结束节次<select id="f-end"></select></label>
    </div>
    <label>上课周次<input id="f-weeks" placeholder="1-16 或 1-16/2（单周）或 1,3,5" autocomplete="off"></label>
    <div class="tip">连续写 1-16；/2 表示隔周（1-10/2 = 双周）；也可写 1,3,5,7</div>
    <div class="row">
      <label>教师<input id="f-teacher" placeholder="选填" autocomplete="off"></label>
      <label>教室<input id="f-room" placeholder="选填" autocomplete="off"></label>
    </div>
    <label>颜色<div class="colors" id="f-colors"></div></label>
    <div class="actions">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn danger" id="btnDelete">删除</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="mask" id="settings">
  <div class="sheet">
    <h3>设置</h3>
    <label>第 1 周周一日期<input type="date" id="s-start"></label>
    <label>学期总周数<input type="number" id="s-weeks" min="1" max="60"></label>
    <label>每天节次时间（每行一节，格式 08:05-08:50）
      <textarea id="s-periods" spellcheck="false"></textarea>
    </label>
    <div class="actions">
      <button class="btn ghost" id="btnExport">导出备份</button>
      <button class="btn ghost" id="btnImport">导入备份</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnReset">恢复默认课表</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnCancelSettings">取消</button>
      <button class="btn primary" id="btnSaveSettings">保存</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</div>

<script>
(function(){
'use strict';

// 🌟 浪漫互动逻辑 🌟
window.loveReply = function(type) {
  const h2 = document.getElementById('loveText');
  const btns = document.getElementById('loveBtns');
  if (type === 'yes') {
    h2.textContent = '超乖！奖励一个亲亲😘';
    btns.style.display = 'none';
    setTimeout(() => {
      document.getElementById('lovePopup').classList.remove('open');
    }, 1500);
  } else {
    h2.textContent = '哼，那再想一会儿！😤';
    // 替换为 dog.gif
    const img = document.querySelector('#lovePopup img');
    if (img) {
      img.src = 'dog.gif';
    }
  }
};

const STORE = 'timetable_v1';
const H = 50;
const DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
// 马卡龙配色
const PALETTE = [
  '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA',
  '#F8C8DC', '#A8E6CF', '#FDCFDF', '#B8E0D2', '#D4A5A5'
];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const toISO = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (iso,n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function mondayThisWeek(){
  const d = new Date();
  const wd = d.getDay() || 7;
  d.setDate(d.getDate() - wd + 1);
  return toISO(d);
}

function parseWeeks(str){
  const set = new Set();
  String(str||'').split(/[,，]/).forEach(function(part){
    part = part.trim();
    if(!part) return;
    const seg = part.split('/');
    const step = Math.max(1, parseInt(seg[1],10) || 1);
    const m = seg[0].trim().match(/^(\d+)\s*[-~－]\s*(\d+)$/);
    if(m){
      for(let i=+m[1]; i<=+m[2]; i+=step) set.add(i);
    } else if(/^\d+$/.test(seg[0].trim())){
      set.add(+seg[0].trim());
    }
  });
  return [...set].sort(function(a,b){return a-b;});
}

function formatWeeks(arr){
  if(!arr || !arr.length) return '';
  const a = [...arr].sort(function(x,y){return x-y;});
  const out = [];
  let s = a[0], p = a[0];
  for(let i=1;i<a.length;i++){
    if(a[i]===p+1){ p = a[i]; continue; }
    out.push(s===p ? String(s) : s+'-'+p);
    s = p = a[i];
  }
  out.push(s===p ? String(s) : s+'-'+p);
  return out.join(',');
}

// 精确修正后的默认状态
function defaultState(){
  const P = parseWeeks;
  return {
    startDate: '2026-09-07',
    totalWeeks: 20,
    periods: [
      {s:'08:05',e:'08:50'},{s:'09:00',e:'09:45'},{s:'10:00',e:'10:45'},{s:'10:55',e:'11:40'},
      {s:'14:25',e:'15:10'},{s:'15:20',e:'16:05'},{s:'16:15',e:'17:00'},{s:'17:10',e:'17:55'},
      {s:'19:30',e:'20:15'},{s:'20:25',e:'21:10'}
    ],
    courses: [
      // 周一
      {id:'c1',name:'管理学基础B',day:1,start:1,end:2,weeks:P('4-11'),room:'D107',teacher:'曾健',color:'#C7CEEA'},
      {id:'c2',name:'高职英语1',day:1,start:3,end:4,weeks:P('4-15'),room:'B111',teacher:'唐莉',color:'#B5EAD7'},
      {id:'c3',name:'大学语文',day:1,start:5,end:6,weeks:P('4-15'),room:'B316',teacher:'邹超才',color:'#FFDAC1'},
      
      // 周二 (4-6双周、7-11周 管理学基础B)
      {id:'c4',name:'管理学基础B',day:2,start:1,end:2,weeks:P('4,6,7-11'),room:'D204',teacher:'曾健',color:'#C7CEEA'},
      {id:'c5',name:'毛泽东思想和中国特色社会主义理论体系概论',day:2,start:3,end:4,weeks:P('6-12'),room:'C105',teacher:'徐兴兴',color:'#F8C8DC'},
      {id:'c6',name:'大学生心理健康教育',day:2,start:5,end:6,weeks:P('8'),room:'D204',teacher:'何晓清',color:'#E2F0CB'},
      {id:'c7',name:'思想道德与法治',day:2,start:9,end:10,weeks:P('6-16'),room:'C201',teacher:'王波',color:'#A8E6CF'},
      
      // 周三
      {id:'c8',name:'大学生心理健康教育',day:3,start:3,end:4,weeks:P('6-9'),room:'D204',teacher:'何晓清',color:'#E2F0CB'},
      {id:'c9',name:'商务礼仪与沟通',day:3,start:5,end:8,weeks:P('9-16'),room:'B505形体礼仪实训室',teacher:'刘娟娟',color:'#FFB7B2'},
      
      // 周四
      {id:'c10',name:'大学生就业指导1',day:4,start:1,end:2,weeks:P('9-12'),room:'B202',teacher:'简富广',color:'#D4A5A5'},
      {id:'c11',name:'高职英语1',day:4,start:3,end:4,weeks:P('4-15'),room:'B109',teacher:'唐莉',color:'#B5EAD7'},
      {id:'c12',name:'毛泽东思想和中国特色社会主义理论体系概论',day:4,start:5,end:6,weeks:P('6-12'),room:'C101',teacher:'徐兴兴',color:'#F8C8DC'},
      {id:'c13',name:'形势与政策',day:4,start:7,end:8,weeks:P('5-8'),room:'A212',teacher:'丁家龙',color:'#FDCFDF'},
      {id:'c14',name:'军事理论',day:4,start:9,end:10,weeks:P('4-8'),room:'C201',teacher:'王波',color:'#B8E0D2'},
      
      // 周五 (4-10双周大学语文)
      {id:'c15',name:'体育与健康1',day:5,start:1,end:2,weeks:P('4-15'),room:'体育场1',teacher:'易志华',color:'#FFC3A0'},
      {id:'c16',name:'大学语文',day:5,start:3,end:4,weeks:P('4-10/2'),room:'B302(新)',teacher:'邹超才',color:'#FFDAC1'},
      {id:'c17',name:'毛泽东思想和中国特色社会主义理论体系概论',day:5,start:5,end:6,weeks:P('5-12'),room:'C101',teacher:'徐兴兴',color:'#F8C8DC'},
      
      // 周六 (第6周补课)
      {id:'c18',name:'大学生心理健康教育',day:6,start:3,end:4,weeks:P('5'),room:'D204',teacher:'何晓清',color:'#E2F0CB'},
      
      // 周日 (第6周补课)
      {id:'c19',name:'管理学基础B',day:7,start:1,end:2,weeks:P('6'),room:'D204',teacher:'曾健',color:'#C7CEEA'},
      {id:'c20',name:'毛泽东思想和中国特色社会主义理论体系概论',day:7,start:3,end:4,weeks:P('2'),room:'C105',teacher:'徐兴兴',color:'#F8C8DC'},
      {id:'c21',name:'思想道德与法治',day:7,start:9,end:10,weeks:P('2'),room:'C201',teacher:'王波',color:'#A8E6CF'}
    ],
    viewWeek: 1
  };
}

let state = null;

function load(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(STORE) || 'null'); }catch(e){}
  if(saved && typeof saved === 'object' && Array.isArray(saved.courses)){
    state = {
      startDate : saved.startDate || '2026-09-07',
      totalWeeks: saved.totalWeeks || 20,
      periods   : (Array.isArray(saved.periods) && saved.periods.length) ? saved.periods : defaultState().periods,
      courses   : saved.courses,
      viewWeek  : 1
    };
  }else{
    state = defaultState();
    save();
  }
}

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }
  catch(e){ console.warn('保存失败', e); }
}

function currentWeek(){
  if(!state.startDate) return 1;
  const start = new Date(state.startDate + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.round((now - start) / 86400000);
  return Math.max(1, Math.min(state.totalWeeks, Math.floor(days/7) + 1));
}

function render(){
  const week = state.viewWeek;
  const N = state.periods.length;
  const monday = addDays(state.startDate, (week-1)*7);
  const sunday = addDays(state.startDate, (week-1)*7 + 6);
  const todayISO = toISO(new Date());

  $('#weekLabel').textContent = '第 ' + week + ' 周';
  $('#dateLabel').textContent = (monday.getMonth()+1)+'月'+monday.getDate()+'日 - '
                              + (sunday.getMonth()+1)+'月'+sunday.getDate()+'日';

  let head = '<div class="corner"></div>';
  for(let i=0;i<7;i++){
    const d = addDays(state.startDate, (week-1)*7 + i);
    const cls = toISO(d) === todayISO ? ' today' : '';
    head += '<div class="day-head'+cls+'">'+DAY_NAMES[i]+'<em>'+(d.getMonth()+1)+'/'+d.getDate()+'</em></div>';
  }
  $('#headRow').innerHTML = head;

  let timeCells = '';
  state.periods.forEach(function(p,i){
    timeCells += '<div class="time-cell" style="height:'+H+'px"><b>'+(i+1)+'</b><span>'+p.s+'</span><span>'+p.e+'</span></div>';
  });

  let cols = '<div class="time-col">'+timeCells+'</div>';
  for(let day=1; day<=7; day++){
    const d = addDays(state.startDate, (week-1)*7 + day - 1);
    const isToday = toISO(d) === todayISO;
    let html = '<div class="day-col" style="height:'+(N*H)+'px;'
             + 'background-image:linear-gradient(to bottom,#f0f2f7 0 1px,transparent 1px);'
             + 'background-size:100% '+H+'px;'
             + (isToday ? 'background-color:#fff5f7;' : '') + '">';

    state.courses
      .filter(function(c){ return c.day === day && Array.isArray(c.weeks) && c.weeks.indexOf(week) > -1; })
      .forEach(function(c){
        const top = (c.start-1)*H + 2;
        const h = (c.end - c.start + 1)*H - 4;
        const subs = [c.room, c.teacher].filter(Boolean)
          .map(function(t){ return '<div class="s">'+esc(t)+'</div>'; }).join('');
        html += '<div class="course" data-id="'+c.id+'" style="top:'+top+'px;height:'+h+'px;background:'
              + (c.color || '#C7CEEA') + '">'
              + '<div class="n">'+esc(c.name)+'</div>' + subs + '</div>';
      });
    html += '</div>';
    cols += html;
  }
  $('#bodyRow').innerHTML = cols;
}

let editingId = null;
let pickedColor = PALETTE[0];

function fillSelects(){
  const N = state.periods.length;
  $('#f-day').innerHTML = DAY_NAMES.map(function(d,i){
    return '<option value="'+(i+1)+'">'+d+'</option>';
  }).join('');
  const opts = Array.from({length:N}, function(_,i){
    return '<option value="'+(i+1)+'">第 '+(i+1)+' 节</option>';
  }).join('');
  $('#f-start').innerHTML = opts;
  $('#f-end').innerHTML = opts;
}

function renderColors(){
  $('#f-colors').innerHTML = PALETTE.map(function(c){
    return '<button type="button" class="sw'+(c===pickedColor?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>';
  }).join('');
}

function openEditor(course){
  fillSelects();
  editingId = course ? course.id : null;
  $('#modalTitle').textContent = course ? '编辑课程' : '添加课程';
  $('#f-name').value = course ? course.name : '';
  $('#f-day').value = course ? course.day : 1;
  $('#f-start').value = course ? course.start : 1;
  $('#f-end').value = course ? course.end : 2;
  $('#f-weeks').value = course ? formatWeeks(course.weeks) : ('1-' + state.totalWeeks);
  $('#f-teacher').value = course ? (course.teacher || '') : '';
  $('#f-room').value = course ? (course.room || '') : '';
  pickedColor = course ? (course.color || PALETTE[0]) : PALETTE[state.courses.length % PALETTE.length];
  renderColors();
  $('#btnDelete').style.display = course ? '' : 'none';
  $('#editor').classList.add('open');
}

function saveCourse(){
  const name = $('#f-name').value.trim();
  if(!name) return alert('请输入课程名称');

  let start = +$('#f-start').value;
  let end   = +$('#f-end').value;
  if(end < start){ const t = start; start = end; end = t; }

  const weeks = parseWeeks($('#f-weeks').value);
  if(!weeks.length) return alert('周次格式不对，示例：1-16 或 4-10/2（双周）或 1,3,5');

  const data = {
    name: name,
    day: +$('#f-day').value,
    start: start,
    end: end,
    weeks: weeks,
    teacher: $('#f-teacher').value.trim(),
    room: $('#f-room').value.trim(),
    color: pickedColor
  };

  if(editingId){
    const c = state.courses.find(function(x){ return x.id === editingId; });
    if(c) Object.assign(c, data);
  }else{
    data.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    state.courses.push(data);
  }
  save();
  $('#editor').classList.remove('open');
  render();
}

$('#prev').onclick = function(){ state.viewWeek = Math.max(1, state.viewWeek-1); save(); render(); };
$('#next').onclick = function(){ state.viewWeek = Math.min(state.totalWeeks, state.viewWeek+1); save(); render(); };
$('#titleBox').onclick = function(){ state.viewWeek = currentWeek(); save(); render(); };
$('#add').onclick = function(){ openEditor(null); };

$('#bodyRow').addEventListener('click', function(e){
  const el = e.target.closest('.course');
  if(!el) return;
  const c = state.courses.find(function(x){ return x.id === el.dataset.id; });
  if(c) openEditor(c);
});

$('#f-colors').addEventListener('click', function(e){
  const b = e.target.closest('.sw');
  if(!b) return;
  pickedColor = b.dataset.c;
  renderColors();
});

$('#btnSave').onclick = saveCourse;
$('#btnCancel').onclick = function(){ $('#editor').classList.remove('open'); };

// 修复：直接删除，不使用confirm（防止WebView拦截）
$('#btnDelete').onclick = function(){
  if(!editingId) return;
  state.courses = state.courses.filter(function(c){ return c.id !== editingId; });
  save();
  $('#editor').classList.remove('open');
  render();
};

$('#gear').onclick = function(){
  $('#s-start').value = state.startDate;
  $('#s-weeks').value = state.totalWeeks;
  $('#s-periods').value = state.periods.map(function(p){ return p.s + '-' + p.e; }).join('\n');
  $('#settings').classList.add('open');
};

$('#btnCancelSettings').onclick = function(){ $('#settings').classList.remove('open'); };

$('#btnSaveSettings').onclick = function(){
  const sd = $('#s-start').value;
  if(!sd) return alert('请选择第 1 周周一的日期');
  const tw = Math.max(1, Math.min(60, parseInt($('#s-weeks').value,10) || 20));

  const periods = $('#s-periods').value.split('\n')
    .map(function(l){ return l.trim(); })
    .filter(Boolean)
    .map(function(l){
      const m = l.match(/^(\d{1,2}:\d{2})\s*[-~到至]\s*(\d{1,2}:\d{2})$/);
      return m ? { s: m[1], e: m[2] } : null;
    })
    .filter(Boolean);
  if(!periods.length) return alert('节次时间格式有误，每行形如 08:05-08:50');

  state.startDate = sd;
  state.totalWeeks = tw;
  state.periods = periods;
  state.viewWeek = currentWeek();
  save();
  $('#settings').classList.remove('open');
  render();
};

// 修复：直接恢复默认，不使用confirm
$('#btnReset').onclick = function(){
  const keepStart = state.startDate;
  const keepWeeks = state.totalWeeks;
  state = defaultState();
  state.startDate = keepStart;
  state.totalWeeks = keepWeeks;
  state.viewWeek = currentWeek();
  save();
  $('#settings').classList.remove('open');
  render();
};

// 修复：导出备份改为复制到剪贴板
$('#btnExport').onclick = function(){
  const jsonStr = JSON.stringify(state, null, 2);
  const ta = document.createElement('textarea');
  ta.value = jsonStr;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert('备份数据已复制到剪贴板！\n请粘贴到备忘录或微信收藏里保存。');
};

$('#btnImport').onclick = function(){ $('#fileInput').click(); };

$('#fileInput').onchange = function(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.courses)) throw new Error('文件格式不对');
      if(d.startDate) state.startDate = d.startDate;
      if(d.totalWeeks) state.totalWeeks = d.totalWeeks;
      if(Array.isArray(d.periods) && d.periods.length) state.periods = d.periods;
      state.courses = d.courses;
      state.viewWeek = currentWeek();
      save();
      $('#settings').classList.remove('open');
      render();
      alert('导入成功');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
};

document.querySelectorAll('.mask').forEach(function(m){
  m.addEventListener('click', function(e){ if(e.target === m) m.classList.remove('open'); });
});

load();
if(!state.startDate){ state.startDate = mondayThisWeek(); save(); }
state.viewWeek = currentWeek();
render();

// 当 App 从后台切回前台时，自动跳转当前周
document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
        state.viewWeek = currentWeek();
        save();
        render();
    }
});

})();
</script>
</body>
</html>
